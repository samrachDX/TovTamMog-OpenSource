name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run lint
      - run: npm test
      - name: Build (also generates the route types the type check needs)
        run: npm run build
      - run: npm run typecheck
