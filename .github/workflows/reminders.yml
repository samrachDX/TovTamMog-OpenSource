# Calls the clock-reminder job every 5 minutes. Vercel's Hobby plan only allows daily crons,
# so this runs it from GitHub instead. Needs two repository secrets:
#   APP_URL      e.g. https://tovtammog.example.com
#   CRON_SECRET  the same value as the app's CRON_SECRET
# GitHub may start scheduled runs a few minutes late; reminders allow 15 minutes of delay.
name: Clock reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET secret not set; skipping."; exit 0; fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/internal/reminders"
